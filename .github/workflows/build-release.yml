name: Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          SDK="$ANDROID_SDK_ROOT"
          if [ -z "$SDK" ]; then SDK="$ANDROID_HOME"; fi
          if [ -n "$SDK" ]; then
            mkdir -p "$SDK/licenses"
            printf '8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n' > "$SDK/licenses/android-sdk-license"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate signing keystore
        shell: bash
        env:
          KS_PASS: "${{ secrets.RELEASE_STORE_PASSWORD }}"
          KEY_PASS: "${{ secrets.RELEASE_KEY_PASSWORD }}"
        run: |
          mkdir -p keystore
          if [ ! -f keystore/release.jks ]; then
            keytool -genkeypair -v -keystore keystore/release.jks \
              -alias docuscan -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "${KS_PASS:-DocuScanBuild2026}" \
              -keypass "${KEY_PASS:-DocuScanBuild2026}" \
              -dname "CN=DocuScan, OU=DocuScan, O=DocuScan, L=Internet, ST=Internet, C=US"
          fi

      - name: Compute version
        id: version
        shell: bash
        run: |
          Y=$(date +%Y)
          M=$(date +%-m)
          D=$(date +%-d)
          CODE="$(( Y * 100000 + M * 1000 + D * 10 + (GITHUB_RUN_NUMBER % 10) ))"
          echo "version_code=$CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=1.0.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          echo "tag=v1.0.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        shell: bash
        env:
          VERSION_CODE: "${{ steps.version.outputs.version_code }}"
          VERSION_NAME: "${{ steps.version.outputs.version_name }}"
          RELEASE_STORE_FILE: keystore/release.jks
          RELEASE_STORE_PASSWORD: "${{ secrets.RELEASE_STORE_PASSWORD }}"
          RELEASE_KEY_PASSWORD: "${{ secrets.RELEASE_KEY_PASSWORD }}"
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease --stacktrace 2>&1 | tee /tmp/gradle.log

      - name: Report build failure as issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "Run: ${{ github.run_number }} — commit ${{ github.sha }}"
            echo ""
            echo '```'
            tail -c 12000 /tmp/gradle.log | tr '\r' '\n' | grep -vE '^[[:space:]]*$' | tail -n 160
            echo '```'
          } > /tmp/issue.md
          python3 - <<'EOF'
          import json, os, urllib.request
          body = open('/tmp/issue.md', encoding='utf-8', errors='replace').read()
          data = json.dumps({
              "title": "Build failure (run " + os.environ.get("GITHUB_RUN_NUMBER", "?") + ")",
              "body": body
          }).encode()
          req = urllib.request.Request(
              "https://api.github.com/repos/" + os.environ["GITHUB_REPOSITORY"] + "/issues",
              data=data, method="POST",
              headers={
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "Accept": "application/vnd.github+json",
                  "User-Agent": "docuscan"
              })
          try:
              urllib.request.urlopen(req)
          except Exception as e:
              print("issue post failed:", e)
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ steps.version.outputs.tag }}"
          name: "DocuScan ${{ steps.version.outputs.version_name }}"
          body: |
            Auto-built from `main`.

            - Build: `${{ github.run_number }}`
            - Commit: `${{ github.sha }}`
          files: app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_files: true
          make_latest: true
